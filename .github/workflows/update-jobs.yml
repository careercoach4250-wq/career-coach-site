name: Update available jobs

on:
  schedule:
    - cron: "0 13 * * *" # 08:00 America/Chicago (Tulane's timezone), daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and filter job listings
        run: node scripts/update-jobs.mjs

      - name: Commit jobs-data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- jobs-data.json; then
            echo "No changes to jobs-data.json"
          else
            git add jobs-data.json
            git commit -m "Update available jobs listing"
            git push
          fi
